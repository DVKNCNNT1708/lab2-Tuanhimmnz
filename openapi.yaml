openapi: 3.1.0
info:
  title: Smart Campus Product A - Camera Stream to Analytics Contract
  version: 1.0.0
  description: |
    Lab 02 contract-first specification for dependency #7: Camera Stream (A2)
    feeds camera events to Analytics (A5) so Analytics can aggregate motion,
    abnormal events, frame analysis results, and camera health.

    The original dependency is Queue async. In Lab 02 this OpenAPI document is
    used as a mockable contract surface for validating event payloads, listing
    accepted events, and reviewing aggregate results before the detailed
    AsyncAPI contract is written in Lab 03.
  contact:
    name: Duong Trong Tuan
    email: 1771020715@student.example.edu.vn
servers:
  - url: http://localhost:4010
    description: Prism mock server
  - url: https://api.product-a.smart-campus.local
    description: Product A class network placeholder
tags:
  - name: health
    description: Service health checks.
  - name: camera-events
    description: Camera event intake and query contract.
  - name: analytics
    description: Camera analytics aggregate query contract.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      description: Returns the mock Analytics contract health status without authentication.
      tags: [health]
      security: []
      responses:
        '200':
          description: Analytics contract mock is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ok:
                  value:
                    status: ok
                    service: analytics-camera-contract
                    version: 1.0.0
                    time: '2026-05-18T16:00:00Z'

  /camera-events:
    post:
      operationId: acceptCameraEvent
      summary: Accept a camera event for analytics
      description: |
        Camera Stream submits the agreed camera event payload to the Analytics
        contract mock. The production integration will use a queue/topic, but
        this endpoint lets both sides validate the payload shape and error model
        in Lab 02.
      tags: [camera-events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraEvent'
            examples:
              motionDetected:
                value:
                  eventId: 01970f8a-7a2b-7d2d-9444-1fbc0a701101
                  eventType: camera.motion.detected
                  occurredAt: '2026-05-18T15:20:00Z'
                  correlationId: 01970f8a-7a2b-7d2d-9444-1fbc0a701100
                  source: camera-stream-a2
                  cameraId: CAM-A-LOBBY-01
                  campusZone: A-Lobby
                  detectionId: 01970f8a-7a2b-7d2d-9444-1fbc0a701102
                  motion:
                    confidence: 0.94
                    boundingBoxes:
                      - x: 0.12
                        y: 0.18
                        width: 0.24
                        height: 0.31
                    imageRef: s3://smart-campus-a/camera/CAM-A-LOBBY-01/frame-001.jpg
              statusChanged:
                value:
                  eventId: 01970f8b-3df2-7a76-9e12-5a78f2fbc601
                  eventType: camera.status.changed
                  occurredAt: '2026-05-18T15:25:00Z'
                  correlationId: 01970f8b-3df2-7a76-9e12-5a78f2fbc600
                  source: camera-stream-a2
                  cameraId: CAM-A-GATE-02
                  campusZone: A-Gate
                  detectionId: null
                  status:
                    previousStatus: online
                    currentStatus: offline
                    reason: network_timeout
                    offlineSeconds: 180
      responses:
        '202':
          description: Event accepted for asynchronous analytics processing.
          headers:
            Location:
              description: URL for reading the accepted event in the mock contract.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccepted'
              examples:
                accepted:
                  value:
                    eventId: 01970f8a-7a2b-7d2d-9444-1fbc0a701101
                    status: accepted
                    acceptedAt: '2026-05-18T15:20:01Z'
                    duplicate: false
                    aggregateJobId: job-20260518-0001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listCameraEvents
      summary: List accepted camera events
      description: |
        Returns accepted camera events with cursor-based pagination so Camera
        Stream and Analytics can verify event delivery, idempotency, and
        correlation during Lab 02 mock testing.
      tags: [camera-events]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/CameraIdFilter'
        - $ref: '#/components/parameters/EventTypeFilter'
      responses:
        '200':
          description: Camera event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEventPage'
              examples:
                firstPage:
                  value:
                    items:
                      - eventId: 01970f8a-7a2b-7d2d-9444-1fbc0a701101
                        eventType: camera.motion.detected
                        occurredAt: '2026-05-18T15:20:00Z'
                        correlationId: 01970f8a-7a2b-7d2d-9444-1fbc0a701100
                        source: camera-stream-a2
                        cameraId: CAM-A-LOBBY-01
                        campusZone: A-Lobby
                        detectionId: 01970f8a-7a2b-7d2d-9444-1fbc0a701102
                        motion:
                          confidence: 0.94
                          boundingBoxes:
                            - x: 0.12
                              y: 0.18
                              width: 0.24
                              height: 0.31
                          imageRef: s3://smart-campus-a/camera/CAM-A-LOBBY-01/frame-001.jpg
                    page:
                      nextCursor: eyJvZmZzZXQiOjF9
                      limit: 20
                      hasMore: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /camera-events/{eventId}:
    get:
      operationId: getCameraEvent
      summary: Get one camera event
      description: Returns one accepted camera event by eventId for audit and troubleshooting.
      tags: [camera-events]
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Camera event detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEvent'
              examples:
                frameAnalyzed:
                  value:
                    eventId: 01970f91-933a-7d5a-b487-7dc4ff1cc301
                    eventType: camera.frame.analyzed
                    occurredAt: '2026-05-18T15:30:00Z'
                    correlationId: 01970f91-933a-7d5a-b487-7dc4ff1cc300
                    source: camera-stream-a2
                    cameraId: CAM-A-LIB-03
                    campusZone: A-Library
                    detectionId: null
                    frame:
                      frameRef: s3://smart-campus-a/camera/CAM-A-LIB-03/frame-330.jpg
                      analysisStatus: completed
                      objectCount: 5
                      abnormalScore: 0.18
                      notes: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /camera-aggregates:
    get:
      operationId: listCameraAggregates
      summary: List camera analytics aggregates
      description: |
        Returns aggregate metrics calculated from camera events with cursor-based
        pagination. This endpoint proves how Analytics will expose derived data
        after consuming the queue events.
      tags: [analytics]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: window
          in: query
          description: Aggregation window.
          required: false
          schema:
            type: string
            enum: [5m, 15m, 1h, 1d]
            default: 15m
        - $ref: '#/components/parameters/CameraIdFilter'
      responses:
        '200':
          description: Camera aggregate page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraAggregatePage'
              examples:
                firstPage:
                  value:
                    items:
                      - cameraId: CAM-A-LOBBY-01
                        campusZone: A-Lobby
                        windowStart: '2026-05-18T15:15:00Z'
                        windowEnd: '2026-05-18T15:30:00Z'
                        motionCount: 12
                        abnormalCount: 1
                        analyzedFrameCount: 48
                        healthStatus: online
                        lastEventId: 01970f8a-7a2b-7d2d-9444-1fbc0a701101
                    page:
                      nextCursor: null
                      limit: 20
                      hasMore: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /camera-aggregates/{cameraId}:
    get:
      operationId: getCameraAggregate
      summary: Get aggregate for one camera
      description: Returns the latest Analytics aggregate for a specific camera.
      tags: [analytics]
      parameters:
        - $ref: '#/components/parameters/CameraId'
        - name: window
          in: query
          description: Aggregation window.
          required: false
          schema:
            type: string
            enum: [5m, 15m, 1h, 1d]
            default: 15m
      responses:
        '200':
          description: Latest camera aggregate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraAggregate'
              examples:
                latest:
                  value:
                    cameraId: CAM-A-LOBBY-01
                    campusZone: A-Lobby
                    windowStart: '2026-05-18T15:15:00Z'
                    windowEnd: '2026-05-18T15:30:00Z'
                    motionCount: 12
                    abnormalCount: 1
                    analyzedFrameCount: 48
                    healthStatus: online
                    lastEventId: 01970f8a-7a2b-7d2d-9444-1fbc0a701101
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /legacy/camera-events/{eventId}:
    get:
      operationId: getLegacyCameraEvent
      summary: Get one camera event using the legacy alias
      description: |
        Deprecated compatibility alias kept only to document versioning and
        Sunset behavior for the Lab 02 homework. New clients must use
        /camera-events/{eventId}.
      tags: [camera-events]
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Camera event detail from the legacy alias.
          headers:
            Sunset:
              description: Date when the legacy alias is planned to be removed.
              schema:
                type: string
                format: date-time
              example: '2026-08-31T00:00:00Z'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEvent'
              examples:
                legacyMotion:
                  value:
                    eventId: 01970f8a-7a2b-7d2d-9444-1fbc0a701101
                    eventType: camera.motion.detected
                    occurredAt: '2026-05-18T15:20:00Z'
                    correlationId: 01970f8a-7a2b-7d2d-9444-1fbc0a701100
                    source: camera-stream-a2
                    cameraId: CAM-A-LOBBY-01
                    campusZone: A-Lobby
                    detectionId: 01970f8a-7a2b-7d2d-9444-1fbc0a701102
                    motion:
                      confidence: 0.94
                      boundingBoxes:
                        - x: 0.12
                          y: 0.18
                          width: 0.24
                          height: 0.31
                      imageRef: s3://smart-campus-a/camera/CAM-A-LOBBY-01/frame-001.jpg
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

webhooks:
  cameraAggregateReady:
    post:
      operationId: receiveCameraAggregateReadyWebhook
      summary: Notify that a camera aggregate is ready
      description: |
        Optional webhook notification from Analytics to internal dashboards when
        a new aggregate window has been computed. This is included for the Lab 02
        homework webhook requirement.
      tags: [analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraAggregateReadyWebhook'
            examples:
              ready:
                value:
                  notificationId: 01970faa-b83e-7ac4-a8d2-85a79f423001
                  aggregate:
                    cameraId: CAM-A-LOBBY-01
                    campusZone: A-Lobby
                    windowStart: '2026-05-18T15:15:00Z'
                    windowEnd: '2026-05-18T15:30:00Z'
                    motionCount: 12
                    abnormalCount: 1
                    analyzedFrameCount: 48
                    healthStatus: online
                    lastEventId: 01970f8a-7a2b-7d2d-9444-1fbc0a701101
                  deliveredAt: '2026-05-18T15:31:00Z'
      responses:
        '202':
          description: Webhook receiver accepted the notification.
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      required: false
      schema:
        type: [string, 'null']
        minLength: 1
        maxLength: 256
      example: eyJvZmZzZXQiOjIwfQ
    Limit:
      name: limit
      in: query
      description: Maximum number of records returned in one page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    CameraId:
      name: cameraId
      in: path
      description: Stable camera identifier.
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 64
        pattern: '^CAM-[A-Z0-9-]+$'
      example: CAM-A-LOBBY-01
    CameraIdFilter:
      name: cameraId
      in: query
      description: Optional camera identifier filter.
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 64
        pattern: '^CAM-[A-Z0-9-]+$'
      example: CAM-A-LOBBY-01
    EventId:
      name: eventId
      in: path
      description: Event identifier generated by Camera Stream.
      required: true
      schema:
        type: string
        format: uuid
      example: 01970f8a-7a2b-7d2d-9444-1fbc0a701101
    EventTypeFilter:
      name: eventType
      in: query
      description: Optional event type filter.
      required: false
      schema:
        $ref: '#/components/schemas/CameraEventType'
      example: camera.motion.detected
  schemas:
    HealthStatus:
      type: object
      required: [status, service, version, time]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          minLength: 1
          maxLength: 80
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        time:
          type: string
          format: date-time

    CameraEvent:
      oneOf:
        - $ref: '#/components/schemas/CameraMotionDetectedEvent'
        - $ref: '#/components/schemas/CameraFrameAnalyzedEvent'
        - $ref: '#/components/schemas/CameraStatusChangedEvent'
      discriminator:
        propertyName: eventType
        mapping:
          camera.motion.detected: '#/components/schemas/CameraMotionDetectedEvent'
          camera.frame.analyzed: '#/components/schemas/CameraFrameAnalyzedEvent'
          camera.status.changed: '#/components/schemas/CameraStatusChangedEvent'

    CameraEventBase:
      type: object
      required:
        - eventId
        - eventType
        - occurredAt
        - correlationId
        - source
        - cameraId
        - campusZone
        - detectionId
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          $ref: '#/components/schemas/CameraEventType'
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        source:
          type: string
          enum: [camera-stream-a2]
        cameraId:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^CAM-[A-Z0-9-]+$'
        campusZone:
          type: string
          minLength: 2
          maxLength: 80
        detectionId:
          type: [string, 'null']
          format: uuid
          description: Detection id from AI Vision if the event has a related detection.

    CameraMotionDetectedEvent:
      allOf:
        - $ref: '#/components/schemas/CameraEventBase'
        - type: object
          required: [eventType, motion]
          properties:
            eventType:
              const: camera.motion.detected
            motion:
              $ref: '#/components/schemas/MotionPayload'

    CameraFrameAnalyzedEvent:
      allOf:
        - $ref: '#/components/schemas/CameraEventBase'
        - type: object
          required: [eventType, frame]
          properties:
            eventType:
              const: camera.frame.analyzed
            frame:
              $ref: '#/components/schemas/FrameAnalyzedPayload'

    CameraStatusChangedEvent:
      allOf:
        - $ref: '#/components/schemas/CameraEventBase'
        - type: object
          required: [eventType, status]
          properties:
            eventType:
              const: camera.status.changed
            status:
              $ref: '#/components/schemas/CameraStatusPayload'

    CameraEventType:
      type: string
      enum:
        - camera.motion.detected
        - camera.frame.analyzed
        - camera.status.changed

    MotionPayload:
      type: object
      required: [confidence, boundingBoxes, imageRef]
      additionalProperties: false
      properties:
        confidence:
          type: number
          minimum: 0
          maximum: 1
        boundingBoxes:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/BoundingBox'
        imageRef:
          type: [string, 'null']
          minLength: 1
          maxLength: 512
          description: Object storage URI; raw image bytes are not embedded in the event.

    FrameAnalyzedPayload:
      type: object
      required: [frameRef, analysisStatus, objectCount, abnormalScore, notes]
      additionalProperties: false
      properties:
        frameRef:
          type: [string, 'null']
          minLength: 1
          maxLength: 512
        analysisStatus:
          type: string
          enum: [completed, partial, failed]
        objectCount:
          type: integer
          minimum: 0
          maximum: 1000
        abnormalScore:
          type: number
          minimum: 0
          maximum: 1
        notes:
          type: [string, 'null']
          maxLength: 500

    CameraStatusPayload:
      type: object
      required: [previousStatus, currentStatus, reason, offlineSeconds]
      additionalProperties: false
      properties:
        previousStatus:
          $ref: '#/components/schemas/CameraHealthStatus'
        currentStatus:
          $ref: '#/components/schemas/CameraHealthStatus'
        reason:
          type: [string, 'null']
          maxLength: 120
        offlineSeconds:
          type: integer
          minimum: 0
          maximum: 86400

    CameraHealthStatus:
      type: string
      enum: [online, degraded, offline]

    BoundingBox:
      type: object
      required: [x, y, width, height]
      additionalProperties: false
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        height:
          type: number
          exclusiveMinimum: 0
          maximum: 1

    EventAccepted:
      type: object
      required: [eventId, status, acceptedAt, duplicate, aggregateJobId]
      additionalProperties: false
      properties:
        eventId:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted]
        acceptedAt:
          type: string
          format: date-time
        duplicate:
          type: boolean
        aggregateJobId:
          type: [string, 'null']
          minLength: 1
          maxLength: 80

    CameraEventPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CameraEvent'
        page:
          $ref: '#/components/schemas/PageInfo'

    CameraAggregatePage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CameraAggregate'
        page:
          $ref: '#/components/schemas/PageInfo'

    PageInfo:
      type: object
      required: [nextCursor, limit, hasMore]
      additionalProperties: false
      properties:
        nextCursor:
          type: [string, 'null']
          minLength: 1
          maxLength: 256
        limit:
          type: integer
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean

    CameraAggregate:
      type: object
      required:
        - cameraId
        - campusZone
        - windowStart
        - windowEnd
        - motionCount
        - abnormalCount
        - analyzedFrameCount
        - healthStatus
        - lastEventId
      additionalProperties: false
      properties:
        cameraId:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^CAM-[A-Z0-9-]+$'
        campusZone:
          type: string
          minLength: 2
          maxLength: 80
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        motionCount:
          type: integer
          minimum: 0
        abnormalCount:
          type: integer
          minimum: 0
        analyzedFrameCount:
          type: integer
          minimum: 0
        healthStatus:
          $ref: '#/components/schemas/CameraHealthStatus'
        lastEventId:
          type: [string, 'null']
          format: uuid

    CameraAggregateReadyWebhook:
      type: object
      required: [notificationId, aggregate, deliveredAt]
      additionalProperties: false
      properties:
        notificationId:
          type: string
          format: uuid
        aggregate:
          $ref: '#/components/schemas/CameraAggregate'
        deliveredAt:
          type: string
          format: date-time

    Problem:
      type: object
      required: [type, title, status, detail, instance, traceId]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 1000
        instance:
          type: string
          minLength: 1
          maxLength: 200
        traceId:
          type: string
          minLength: 1
          maxLength: 100
        invalidParams:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/InvalidParam'

    InvalidParam:
      type: object
      required: [name, reason]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        reason:
          type: string
          minLength: 1
          maxLength: 300

  responses:
    BadRequest:
      description: Request syntax, query, or body is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidPayload:
              value:
                type: https://errors.smart-campus.local/bad-request
                title: Invalid request
                status: 400
                detail: eventType must be one of the documented camera event types.
                instance: /camera-events
                traceId: trace-400-camera-event
                invalidParams:
                  - name: eventType
                    reason: Unsupported event type.
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingToken:
              value:
                type: https://errors.smart-campus.local/unauthorized
                title: Unauthorized
                status: 401
                detail: Bearer token is missing or invalid.
                instance: /camera-events
                traceId: trace-401-camera-event
                invalidParams: []
    Forbidden:
      description: Caller is authenticated but not allowed to access the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              value:
                type: https://errors.smart-campus.local/forbidden
                title: Forbidden
                status: 403
                detail: Token scope does not allow camera analytics access.
                instance: /camera-events
                traceId: trace-403-camera-event
                invalidParams: []
    NotFound:
